name: SDK checks

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: 1.90.0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: Rust native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint the SDK
        run: cargo clippy --locked -p auki-sdk --all-targets -- -D warnings
      - name: Test every stable core crate
        run: |
          mkdir -p output/ci
          cargo test --locked \
            -p auki-auth -p auki-domain-client -p auki-dms -p auki-fleet \
            -p auki-p2p -p auki-relay-booking -p auki-tasks -p auki-sdk \
            2>&1 | tee output/ci/native-tests.log
      - name: Lint the Component experiment and synthetic volume demo
        run: |
          cargo clippy --locked -p auki-components -p auki-component-protocol \
            -p auki-component-volume-monitor --all-targets --no-deps -- -D warnings
      - name: Test Components and authenticated loopback volume exchange
        run: |
          # Default features: no microphone access, audio drivers, or shared services.
          cargo test --locked -p auki-components -p auki-component-protocol \
            -p auki-qr-detector -p auki-component-volume-monitor \
            2>&1 | tee output/ci/component-tests.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: native-failure
          path: output/ci
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: Python binding
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/bindings/python/auki-sdk-py/pyproject.toml
            core/bindings/python/auki-sdk-py/python_tests/requirements.txt
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the Python extension
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install 'maturin>=1.5,<2.0' -r core/bindings/python/auki-sdk-py/python_tests/requirements.txt
          # The full suite includes tests of the default protocol exports.
          maturin develop --locked --manifest-path core/bindings/python/auki-sdk-py/Cargo.toml
      - name: Test the Python binding
        timeout-minutes: 5
        run: |
          mkdir -p output/ci
          .venv/bin/python -m pytest core/bindings/python/auki-sdk-py/python_tests -q --junitxml=output/ci/python.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: python-failure
          path: output/ci
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web and Expo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            core/bindings/web/auki-sdk-web/package-lock.json
            core/bindings/expo/package-lock.json
            core/examples/portable-echo/web/package-lock.json
      - name: Install Rust and wasm-pack
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --target wasm32-unknown-unknown
          npm install --global wasm-pack@0.13.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Lint the WASM SDK and binding
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown \
            -p auki-sdk -p auki-sdk-web --lib \
            --features auki-sdk-web/finite-protocols,auki-sdk-web/message,auki-sdk-web/stream \
            -- -D warnings
      - name: Test the actual browser binding
        timeout-minutes: 10
        run: |
          mkdir -p output/ci
          wasm-pack test --headless --chrome --chromedriver "$CHROMEWEBDRIVER/chromedriver" \
            core/bindings/web/auki-sdk-web --locked --lib \
            2>&1 | tee output/ci/browser-tests.log
      - name: Build Web binding and check TypeScript
        working-directory: core/bindings/web/auki-sdk-web
        run: |
          npm ci
          npm run check
      - name: Build the portable Web example
        working-directory: core/examples/portable-echo/web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Test and build the Expo package
        working-directory: core/bindings/expo
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
          node --test scripts/prepare-metro-wasm.test.cjs
          npm run test:domain-data
          npm run test:jobs
          npm run test:fleet
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: web-failure
          path: output/ci
          if-no-files-found: ignore
          retention-days: 7
