[workspace]
resolver = "2"
members = [
    # Stable SDK crates.
    "core/auki-auth",
    "core/auki-dms",
    "core/auki-p2p",
    "core/auki-relay-booking",
    "core/auki-sdk",

    # SDK bindings and networking examples.
    "core/bindings/python/auki-sdk-py",
    "core/bindings/swift/auki-sdk-swift",
    "core/bindings/web/auki-sdk-web",
    "core/examples/portable-echo",
    "core/examples/portable-echo/native",
    "core/examples/portable-echo/python",
    "core/examples/portable-echo/swift/ffi",
    "core/examples/portable-echo/web",

    # Experimental crates; application protocols remain optional.
    "labs/auki-datatypes",
    "labs/auki-geometry",
    "labs/auki-hash",
    "labs/auki-identity",
    "labs/auki-jcs",
    "labs/auki-layout",
    "labs/auki-logs",
    "labs/auki-manifests",
    "labs/auki-mappers",
    "labs/auki-maps",
    "labs/auki-protocols",
    "labs/auki-qr-detector",
    "labs/auki-registry",
    "labs/auki-ros-adapter",
    "labs/auki-session",
    "labs/auki-time",
    "labs/auki-urdf-fk",

    # Experimental bindings and examples.
    "labs/bindings/python/auki-geometry-py",
    "labs/bindings/python/auki-identity-py",
    "labs/bindings/python/auki-layout-py",
    "labs/bindings/python/auki-logs-py",
    "labs/bindings/python/auki-manifests-py",
    "labs/bindings/python/auki-mappers-py",
    "labs/bindings/python/auki-registry-py",
    "labs/bindings/python/auki-session-py",
    "labs/bindings/swift/auki-identity-swift",
    "labs/examples/standard-protocols/native",
    "labs/examples/camera-mesh",
    "labs/examples/camera-mesh/native",
    "labs/examples/camera-mesh/swift/ffi",
]

[workspace.package]
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/aukilabs/auki-sdk"
authors = ["Auki Labs Limited"]

[workspace.dependencies]
anyhow = "1.0.95"
async-channel = "2.5.0"
async-trait = "0.1.88"
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
futures = "0.3.30"
futures-timer = { version = "3.0.3", features = ["wasm-bindgen"] }
hex = "0.4.3"
http = "1.4.0"
js-sys = "0.3.98"
libp2p = { version = "0.56.0", default-features = false }
libp2p-identity = { version = "0.2.13", default-features = false, features = ["ed25519", "peerid", "rand"] }
# `libp2p-stream` is pre-release and must remain in the libp2p 0.56 /
# libp2p-swarm 0.47 type family.
libp2p-stream = "=0.4.0-alpha"
parking_lot = "0.12.3"
rand = "0.8"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = "1.0.210"
serde_json = "1.0.128"
serde-wasm-bindgen = "0.6.5"
sha2 = "0.10.8"
tempfile = "3.21.0"
thiserror = "2.0.12"
tokio = "1.44.2"
tokio-util = "0.7.16"
tracing = "0.1.40"
uuid = { version = "1.10.1", features = ["v4", "serde"] }
web-time = "1.1.0"
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
zeroize = "1.8.1"
