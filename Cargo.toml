[workspace]
resolver = "2"
members = [
    "crates/auki-hash",
    "crates/auki-geometry",
    "crates/auki-maps",
    "crates/auki-mappers",
    "bindings/python/auki-mappers-py",
    "bindings/python/auki-geometry-py",
    "crates/auki-identity",
    "bindings/python/auki-identity-py",
    "crates/auki-jcs",
    "crates/auki-logs",
    "bindings/python/auki-logs-py",
    "crates/auki-manifests",
    "bindings/python/auki-manifests-py",
    "crates/auki-p2p",
    "crates/auki-auth",
    "crates/auki-sdk",
    "crates/auki-protocols",
    "crates/auki-domain-relay",
    "bindings/swift/auki-identity-swift",
    "crates/auki-datatypes",
    "crates/auki-domain",
    "bindings/python/auki-domain-py",
    "crates/auki-qr-detector",
    "crates/auki-registry",
    "bindings/python/auki-registry-py",
    "crates/auki-ros-adapter",
    "crates/auki-layout",
    "bindings/python/auki-layout-py",
    "crates/auki-session",
    "bindings/python/auki-session-py",
    "crates/auki-time",
    "examples/diagnostic-app",
]

[workspace.package]
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/aukilabs/auki-sdk"
authors = ["Auki Labs Limited"]

[workspace.dependencies]
anyhow = "1.0.95"
async-trait = "0.1.88"
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
futures = "0.3.30"
hex = "0.4.3"
http = "1.4.0"
libp2p = { version = "0.56.0", default-features = false }
# `libp2p-stream` is pre-release and must remain in the libp2p 0.56 /
# libp2p-swarm 0.47 type family.
libp2p-stream = "=0.4.0-alpha"
parking_lot = "0.12.3"
rand = "0.8"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = "1.0.210"
serde_json = "1.0.128"
sha2 = "0.10.8"
tempfile = "3.21.0"
thiserror = "2.0.12"
tokio = "1.44.2"
tokio-util = "0.7.16"
tracing = "0.1.40"
uuid = { version = "1.10.1", features = ["v4", "serde"] }
zeroize = "1.8.1"
