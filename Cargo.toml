[workspace]
resolver = "2"
members = [
    "crates/auki-hash",
    "crates/auki-geometry",
    "crates/auki-identity",
    "crates/auki-uniffi-test",
    "bindings/python/auki-identity-py",
    "crates/auki-jcs",
    "crates/auki-logs",
    "bindings/python/auki-logs-py",
    "crates/auki-manifests",
    "bindings/python/auki-manifests-py",
    "crates/auki-network",
    "bindings/python/auki-network-py",
    "crates/auki-proto",
    "crates/auki-domain",
    "bindings/python/auki-domain-py",
    "crates/auki-registry",
    "bindings/python/auki-registry-py",
    "crates/auki-ros-adapter",
    "crates/auki-layout",
    "bindings/python/auki-layout-py",
    "bindings/python/auki-session-py",
    "crates/auki-time",
    "examples/diagnostic-app",
    "tools/proto-gen-rust",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/aukilabs/auki-sdk"
authors = ["Auki Labs Limited"]
version = "0.0.1"

[patch.crates-io]
# libp2p-webrtc 0.9.0-alpha.1 pulls webrtc 0.12.0, whose default SRTP
# profile list can negotiate AES-256-GCM with node-datachannel. Its paired
# webrtc-srtp 0.14.0 implementation panics on that profile, so keep the
# dependency local until upstream ships a compatible fix.
webrtc = { path = "vendor/webrtc-0.12.0-auki" }
