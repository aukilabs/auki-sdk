[package]
name = "auki-domain-py"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DEPRECATED — was PyO3 bindings for `auki-domain`. Stubbed empty in #216; use auki-session-py (follow-up) instead."

[lib]
# `cdylib` produces the Python native extension (.so / .pyd).
# `rlib` keeps the crate usable from within the workspace (cargo test, etc.).
name = "auki_domain"
crate-type = ["cdylib", "rlib"]

[features]
# `extension-module` tells PyO3 to skip linking the Python runtime —
# symbols are resolved at import time by the host interpreter. Default
# is empty so `cargo test` can link Python (`auto-initialize`).
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
# `abi3-py38` builds a stable-ABI extension that works on Python 3.8+
# without rebuilding per minor version.
pyo3 = { version = "0.22", features = ["abi3-py38"] }

[dev-dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
