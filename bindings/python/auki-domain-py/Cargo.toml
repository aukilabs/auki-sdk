[package]
name = "auki-domain-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for the authenticated Auki Domain lifecycle and application protocols."

[lib]
# `cdylib` makes the crate build as a Python native extension; `rlib`
# keeps it usable from Rust (`cargo test` against the in-tree crate,
# which links Python via the `auto-initialize` dev-feature). Lib name
# is `auki_domain` — the same as the Python module name.
name = "auki_domain"
crate-type = ["cdylib", "rlib"]

[features]
# `extension-module` tells PyO3 to skip linking the Python runtime —
# symbols are resolved at import time by the host interpreter. Default
# is empty so `cargo test` can link Python (`auto-initialize`).
default = []
extension-module = ["pyo3/extension-module"]
test-support = ["dep:auki-p2p", "dep:jsonwebtoken"]

[dependencies]
auki-datatypes = { path = "../../../crates/auki-datatypes" }
auki-domain-rs = { package = "auki-domain", path = "../../../crates/auki-domain", features = ["native_runtime"] }
auki-logs-rs = { package = "auki-logs", path = "../../../crates/auki-logs" }
auki-network = { path = "../../../crates/auki-network", features = ["protocol-codecs"] }
auki-p2p = { path = "../../../crates/auki-p2p", optional = true }
auki-registry = { path = "../../../crates/auki-registry" }
auki-session-rs = { package = "auki-session", path = "../../../crates/auki-session" }
futures.workspace = true
jsonwebtoken = { version = "9", optional = true }
parking_lot.workspace = true
prost = "0.13"
pyo3 = { version = "0.22", features = ["abi3-py38"] }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
tempfile = "3"
