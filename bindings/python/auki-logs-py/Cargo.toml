[package]
name = "auki-logs-py"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for `auki-logs`'s `Log<T>` framing primitive — opaque-bytes Python surface that lets Python producers and consumers (e.g. the ESL detector) participate in the SDK's segmented ring-buffer log on equal footing with Rust. Wraps `Log.open` / `Log.append` / `Log.flush` / `Log.read` / `Log.tail` (blocking iterator over newly-appended entries) over an opaque `bytes` payload — Python handles prost encode/decode itself via `betterproto` or hand-rolled, matching the Rust crate's encoder-agnostic stance."

[lib]
# `cdylib` makes the crate build as a Python native extension.
# `rlib` keeps it usable from Rust (`cargo test` against the in-tree
# crate, which links Python at test time via the `auto-initialize`
# feature on dev-deps).
name = "auki_logs"
crate-type = ["cdylib", "rlib"]

[features]
# `extension-module` tells PyO3 to skip linking the Python runtime —
# symbols are resolved at import time by the host interpreter. Standard
# pattern for native Python extensions; `maturin develop` / `maturin
# build` enable it via `[tool.maturin]` in `pyproject.toml`.
#
# Default is empty so `cargo test` can link Python (via `pyo3`'s
# `auto-initialize` dev-feature) and `Python::with_gil` works out of
# the box. Enabling `extension-module` would skip that link and the
# test binary would fail to load — the two modes are mutually
# exclusive. Same shape as `auki-network-py`.
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
# Renamed via `package =` so the upstream crate's name doesn't collide
# with our own lib name `auki_logs` (which is also the Python module
# name the `#[pymodule]` macro generates the entry point for).
auki-logs-rs = { package = "auki-logs", path = "../../../crates/auki-logs" }
# `serde_json::Value` is the manifest type on the Rust seam; Python
# passes a dict that we walk into a `serde_json::Value` for `Log::open`,
# and we walk the Rust `serde_json::Value` back into a dict for
# `manifest()`.
serde_json = "1"
# `abi3-py38` builds a stable-ABI extension that works on Python 3.8+
# without rebuilding per minor version. Same as `auki-network-py`.
pyo3 = { version = "0.22", features = ["abi3-py38"] }

[dev-dependencies]
# `auto-initialize` so `Python::with_gil` works in `cargo test` runs
# against the rlib (no Python interpreter set up by the test harness
# otherwise). Mutually exclusive with `extension-module`; CI / maturin
# builds enable the latter and skip dev-deps.
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
tempfile = "3"
