[package]
name = "auki-mappers-py"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Python bindings for SDK-native Mappers."

[lib]
name = "auki_mappers"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
auki-datatypes = { path = "../../../crates/auki-datatypes" }
auki-mappers-rs = { package = "auki-mappers", path = "../../../crates/auki-mappers" }
auki-registry = { path = "../../../crates/auki-registry" }
prost = "0.13"
pyo3 = { version = "0.22", features = ["abi3-py38"] }
serde_json = "1"

[dev-dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
