[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "auki-mappers-py"
version = "0.0.0"
description = "Python bindings for SDK-native Mappers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Auki Labs Limited" }]
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "auki_mappers"

