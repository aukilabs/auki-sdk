[package]
name = "auki-registry-py"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for auki-registry's Sensor, Clock, and Frame Registry entry constructors plus hash-pinned on-disk read/write helpers."

[lib]
name = "auki_registry"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
auki-registry-rs = { package = "auki-registry", path = "../../../crates/auki-registry" }
pyo3 = { version = "0.22", features = ["abi3-py38"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
tempfile = "3"
