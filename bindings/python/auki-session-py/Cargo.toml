[package]
name = "auki-session-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for `auki-session` — transport-neutral in-process Python surface for opening sessions, registering sensors and clocks, writing/listing sensor and pose logs. Source-of-truth API; the HTTP Control API (frozen at v0.0.23) and forthcoming libp2p control protocols both wrap this surface."

[lib]
# `cdylib` makes the crate build as a Python native extension.
# `rlib` keeps it usable from Rust (`cargo test` against the in-tree
# crate, which links Python at test time via the `auto-initialize`
# feature on dev-deps), matching the other SDK Python extensions.
name = "auki_session"
crate-type = ["cdylib", "rlib"]

[features]
# Default empty so `cargo test` can link Python via dev-dep
# `auto-initialize`. `maturin develop` / `maturin build` enable
# `extension-module` via `pyproject.toml` to skip linking and let the
# host interpreter resolve symbols at import time.
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
# `abi3-py38` — stable-ABI extension that works on Python 3.8+ without
# rebuilding per minor version.
pyo3 = { version = "0.22", features = ["abi3-py38"] }
# Core session crate being wrapped.
auki-session-rs = { package = "auki-session", path = "../../../crates/auki-session" }
# Re-used for RegistryRef / LogRef Rust types.
auki-registry-rs = { package = "auki-registry", path = "../../../crates/auki-registry" }
# Source-of-truth for RegistryRef / LogRef pyclasses.
auki-registry-py = { path = "../auki-registry-py" }
# Re-used for PoseSource / PoseWriterMode / TimeTransformSource Rust types.
auki-manifests-rs = { package = "auki-manifests", path = "../../../crates/auki-manifests" }
# JSON conversion helpers for Python dictionaries and enum values.
serde_json = "1"
# JSON serialization helpers.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# `auto-initialize` lets `Python::with_gil` work in `#[test]`s without
# manually starting an interpreter; needs the runtime linked, which is
# why we don't enable it on the production extension build.
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
tempfile = "3"
