[package]
name = "auki-network-swift"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "UniFFI Swift bindings for `auki-network` — exposes the Discovery service HTTP client to native iOS (Swift) peers."

[lib]
# `staticlib` is the iOS-consumable artifact (dynamic libs are heavily
# constrained on-device); `cdylib` lets library-mode `uniffi-bindgen`
# introspect it on the host; `rlib` keeps in-workspace Rust consumers
# working. Lib name `auki_network_swift` is distinct from
# `auki-network`'s own lib name so both can be direct deps in one
# workspace, mirroring the `auki-network-py` precedent.
name = "auki_network_swift"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Enables the `uniffi-bindgen` helper binary (Swift codegen host tool).
# Default-off so a normal `cargo build`/`cargo test` of the library
# doesn't pull the UniFFI CLI.
cli = ["uniffi/cli"]

[dependencies]
# Used by the `try_lift` arms of `uniffi::custom_type!` declarations.
anyhow = "1"
# Renamed via `package =` so the upstream crate's name doesn't collide
# with our own lib name, exactly as `auki-network-py` does. PR A added
# `swift-bindings`; PR B enables `swarm` (for NetworkRuntime + the
# stream surface) and keeps `discovery_client` (for the Discovery HTTP client
# we're now consuming as upstream-annotated types). All three are independent
# features on the upstream crate; combined here.
auki-network-rs = { package = "auki-network", path = "../../../crates/auki-network", features = ["swift-bindings", "swarm", "discovery_client"] }
# `PeerId` / `Multiaddr` parsing on the Swift ↔ Rust seam (they cross
# the FFI as their canonical string forms).
libp2p-identity = { version = "0.2", default-features = false, features = ["ed25519", "peerid", "serde"] }
multiaddr = "0.18"
# Process-wide multi-thread tokio runtime that UniFFI drives the
# exported async fns on (reqwest needs a reactor). See lib.rs.
tokio = { version = "1", features = ["rt-multi-thread"] }
# Swift→Rust source-stream adapter wraps `tokio::sync::mpsc::Receiver`s in
# `tokio_stream::wrappers::ReceiverStream` to satisfy the upstream
# `SourceStream<T> = Pin<Box<dyn Stream<Item=...> + Send>>` shape.
tokio-stream = { version = "0.1", default-features = false }
# UniFFI proc-macro mode (no UDL). `tokio` feature enables
# `#[uniffi::export(async_runtime = "tokio")]`. ≥0.30 is required for
# Rust 2024-edition crates (edition-2024 scaffolding fix).
uniffi = { version = "0.31", features = ["tokio"] }
# FFI error enum Display / std::error::Error impls.
thiserror = "2"

# Swift codegen helper. Gated on `cli` so a plain library build/test
# doesn't require the UniFFI CLI; the build script enables the feature.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]
