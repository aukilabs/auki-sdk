[package]
name = "auki-sdk-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Temporary Web adapter bridge to the canonical auki-sdk browser facade"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
auki-sdk = { path = "../../../crates/auki-sdk" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
auki-p2p = { path = "../../../crates/auki-p2p" }
uuid = { workspace = true, features = ["js"] }
