[package]
name = "auki-tasks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native task lease lifecycle for Auki compute handlers"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
async-trait.workspace = true
auki-auth = { path = "../auki-auth" }
auki-dms = { path = "../auki-dms" }
auki-domain-client = { path = "../auki-domain-client" }
chrono.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
url = "2.5"
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
httpmock = "0.8.3"
base64.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
