[package]
name = "auki-barcode-detector"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "rxing-backed Auki SDK Detector producing typed barcode Detection Log payloads."

[dependencies]
auki-datatypes = { path = "../auki-datatypes" }
auki-registry = { path = "../auki-registry" }
auki-session = { path = "../auki-session" }
futures = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rxing = { version = "0.9.2", default-features = false, features = [
    "encoding_rs",
    "serde",
    "decoders",
    "encoders",
    "oned",
    "multi_barcode_readers",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
auki-logs = { path = "../auki-logs" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
