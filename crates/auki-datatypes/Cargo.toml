[package]
name = "auki-datatypes"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Single source of truth for the Auki SDK's shared cross-language data types. Owns the .proto schemas and prost-generated Rust payload types consumed by logs, protocols, adapters, and time primitives."

[dependencies]
# Runtime support for prost-generated types — Message trait, encode /
# decode, well-known types, etc.
prost = "0.13"
# `LogPayload` trait — every prost-generated payload type below gets a
# blanket-style impl through the `impl_log_payload!` macro so consumers
# can drop them straight into `auki_logs::Log<T>`.
auki-logs = { path = "../auki-logs" }

[build-dependencies]
# Compiles .proto → Rust at build time. Output lands in OUT_DIR and is
# included from src/lib.rs.
prost-build = "0.13"
# Bundles a protoc binary so the build is self-contained — no system
# protoc install required on dev machines or CI. The build.rs sets
# PROTOC to the vendored binary's path before invoking prost-build.
protoc-bin-vendored = "3"

[dev-dependencies]
# Locked-vector tests pin both the wire bytes and their XXH3-128 hash,
# matching the convention from `auki-manifests` / `auki-registry`. Hash
# lock catches drift in either prost-build's output or `auki-hash`
# itself; cross-language readers (betterproto, future Sentinel) MUST
# match both values.
auki-hash = { path = "../auki-hash" }
# Segment round-trip test exercises the prost ↔ LogPayload ↔ auki-logs
# encoder seam end-to-end through a real `Log<CameraFrame>`.
serde_json = "1"
tempfile = "3"
