[package]
name = "auki-datatypes"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Single source of truth for the Auki SDK's shared cross-language data types. Owns the .proto schemas and the prost-generated Rust code for log payload types (camera frames, point clouds, audio chunks, transforms, time-transform samples). Downstream Rust crates (auki-logs, auki-network, auki-ros-adapter, auki-time-transforms) import the generated types from here. Cross-language consumers (Python via betterproto, future Sentinel ports) generate their own bindings from the same .proto files. Encoding is protobuf via prost; the name names the responsibility, not the implementation."

[dependencies]
# Runtime support for prost-generated types — Message trait, encode /
# decode, well-known types, etc.
prost = "0.13"

[build-dependencies]
# Compiles .proto → Rust at build time. Output lands in OUT_DIR and is
# included from src/lib.rs.
prost-build = "0.13"
# Bundles a protoc binary so the build is self-contained — no system
# protoc install required on dev machines or CI. The build.rs sets
# PROTOC to the vendored binary's path before invoking prost-build.
protoc-bin-vendored = "3"
