syntax = "proto3";

package auki.audio;

// Audio payload — used on both disk (Sensor Log segment payload for a
// log whose registry entry has body kind `audio`) and on the wire (the
// libp2p `/auki/stream/0.2.0` substream payload). One type, one byte
// shape; the framing's `timestamp_ns` carries chunk start time on both
// paths.
//
// Opaque-bytes-only (Step 4, 2026-05-08): the SensorRegistryEntry's
// `Audio { sample_format, channels, sample_rate_hz, channel_layout,
// frame_id }` body — pinned by `(sensor_id, sensor_hash)` on the log's
// manifest / stream's accept handshake — is the single source of truth
// for interpretation. Sample count is derivable as
// `data.len() / (sample_byte_width × channels)`; chunk duration is
// derivable as `sample_count × 1e9 / sample_rate_hz`. Carrying either
// on the per-chunk entry would denormalize derivable metadata into the
// bytes for marginal reader convenience and risk inconsistency between
// the field and the bytes.
//
// Samples are interleaved: for `channels = N`, the byte stream is
// `[s0_c0, s0_c1, ..., s0_cN-1, s1_c0, s1_c1, ...]`. Each sample's
// encoding is per the registry entry's `sample_format` (e.g. `pcm_s16le`,
// `pcm_f32le`).
//
// Field number ledger (never reuse, never renumber):
//   Data.data = 1

message Data {
  bytes data = 1;
}
