syntax = "proto3";

package auki.audio_stream;

// Audio-stream substream payload `T` for `/auki/stream/0.1.0` — Dialogue
// Batch 1 (SDK Rust core). The producer emits one `AudioFrame` per
// captured audio chunk; consumers (Boosterapp's K1 `AudioPlayer` driver,
// future Sentinel) decode and push the bytes into a player session.
// The stream entry's timestamp and sequence ride in
// `auki.stream.StreamEntry { timestamp_ns, seq, payload: bytes }` — this
// message IS the bytes inside `StreamEntry.payload`.
//
// Opaque-bytes-only, matching the Step 3 (point cloud) / Step 4 (audio
// log) stance. The `SensorRegistryEntry`'s
// `Audio { sample_format, channels, sample_rate_hz, channel_layout,
// frame_id }` body — pinned by `(sensor_id, sensor_hash)` at handshake
// — is the single source of truth for interpretation. Sample count is
// derivable as `data.len() / (sample_byte_width × channels)`; chunk
// duration is derivable as `sample_count × 1e9 / sample_rate_hz`.
// Carrying either on the per-frame payload would denormalize derivable
// metadata into the bytes for marginal reader convenience and risk
// inconsistency between the field and the bytes.
//
// Samples are interleaved: for `channels = N`, the byte stream is
// `[s0_c0, s0_c1, ..., s0_cN-1, s1_c0, s1_c1, ...]`. Each sample's
// encoding is per the registry entry's `sample_format` (e.g.
// `pcm_s16le`, `pcm_f32le`).
//
// Symmetric with the on-disk `auki.audio.AudioLogEntry` — same
// `bytes data = 1` shape on disk and on wire. Mirrors the point-cloud
// pattern (Migration Steps 2/3) and joint-encoders pattern (Step 5)
// where wire and disk payloads have identical shape and exist as
// separate proto packages only so wire and log code paths dispatch on
// distinct Rust types. Symmetry is locked by the
// `audio_disk_wire_byte_identical` test in `auki-datatypes`.
//
// Field number ledger (never reuse, never renumber):
//   AudioFrame.data = 1

message AudioFrame {
  bytes data = 1;
}
