syntax = "proto3";

package auki.camera;

// Per-frame camera log payload — the segment payload for a Sensor Log
// whose registry entry has body kind `camera`. The frame timestamp
// rides in the auki-logs framing's `timestamp_ns`, not here.
//
// The Camera Sensor Registry entry may pin a static calibration for its
// immutable published image geometry. `dynamic_intrinsics` is an optional
// per-frame override: when present it replaces the complete static calibration
// for this frame; fields are not merged. Cameras whose intrinsics don't change
// frame-to-frame omit it. Metric consumers must fail closed when neither source
// is available rather than guessing intrinsics.
//
// Field number ledger (never reuse, never renumber):
//   CameraFrame.dynamic_intrinsics = 1
//   CameraFrame.frame              = 2
//   DynamicIntrinsics.fx                     = 1
//   DynamicIntrinsics.fy                     = 2
//   DynamicIntrinsics.cx                     = 3
//   DynamicIntrinsics.cy                     = 4
//   DynamicIntrinsics.distortion_coefficients = 5

message DynamicIntrinsics {
  double fx = 1;
  double fy = 2;
  double cx = 3;
  double cy = 4;
  repeated double distortion_coefficients = 5;
}

message CameraFrame {
  DynamicIntrinsics dynamic_intrinsics = 1;
  bytes frame = 2;
}
