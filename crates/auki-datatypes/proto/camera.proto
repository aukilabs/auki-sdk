syntax = "proto3";

package auki.camera;

// Per-frame camera log payload — the segment payload for a Sensor Log
// whose registry entry has body kind `rgb_camera`. The frame timestamp
// rides in the auki-logs framing's `timestamp_ns`, not here.
//
// `dynamic_intrinsics` is inline-optional per the Step 1 decision in
// ../parking_lot.md. Cameras whose intrinsics don't change frame-to-frame
// pay ~1 byte/frame for the absent-tag; autofocusing cameras populate it
// per-frame. Promoting to a sibling intrinsics-update sub-stream remains
// possible without breaking on-disk readers — drop the field, mark its
// number reserved, add a sibling log.
//
// Field number ledger (never reuse, never renumber):
//   PinholeCameraLogEntry.dynamic_intrinsics = 1
//   PinholeCameraLogEntry.frame              = 2
//   DynamicIntrinsics.fx                     = 1
//   DynamicIntrinsics.fy                     = 2
//   DynamicIntrinsics.cx                     = 3
//   DynamicIntrinsics.cy                     = 4
//   DynamicIntrinsics.distortion_coefficients = 5

message DynamicIntrinsics {
  double fx = 1;
  double fy = 2;
  double cx = 3;
  double cy = 4;
  repeated double distortion_coefficients = 5;
}

message PinholeCameraLogEntry {
  DynamicIntrinsics dynamic_intrinsics = 1;
  bytes frame = 2;
}
