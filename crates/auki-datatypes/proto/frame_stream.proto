syntax = "proto3";

package auki.frame_stream;

// JPEG-encoded preview frame — the libp2p substream payload `T` for the
// preview-camera stream. Byte-identical (semantically) to what the daemon
// would have served at GET /api/preview/latest.jpg over HTTP. The substream
// is mono-T: producer/consumer agree on JpegFrame at handshake time via
// `StreamRequest.sensor_id` → SensorRegistryEntry, then the SDK encodes/
// decodes `JpegFrame` for each `StreamEntry.payload` on the wire.
//
// Field number ledger (never reuse, never renumber):
//   JpegFrame.bytes = 1

message JpegFrame {
  bytes bytes = 1;
}
