syntax = "proto3";

package auki.joint_encoders;

// Joint-encoder payload — used on both disk (Sensor Log segment payload
// for a log whose registry entry has body kind `joint_encoders`) and on
// the wire (the libp2p `/auki/stream/0.1.0` substream payload). One
// type, one byte shape; the framing's `timestamp_ns` carries the
// sample timestamp on both paths.
//
// Joint angles are encoder readings — measurements of joint positions,
// before any kinematic interpretation. Forward kinematics (joint space
// → cartesian TF) is a consumer-side derivation; the URDF that drives
// it lives with the consumer (Park, future analyses), not with the
// producer. Mirrors the layering of `auki.point_cloud` and
// `auki.audio`: producer ships raw measurements + just enough
// deserialization metadata (`joint_count` on the registry body) for
// the consumer to read the bytes correctly.
//
// Joint ordering is producer-defined and immutable per stream/log; the
// SensorRegistryEntry's `JointEncoders { joint_count }` body — pinned
// by `(sensor_id, sensor_hash)` — pins vector length and is the single
// source of interpretation. Mapping joint indices to URDF links is a
// consumer-side concern.
//
// Field number ledger (never reuse, never renumber):
//   Data.angles_rad = 1

message Data {
  // Joint angle readings in radians, indexed in the producer's emit
  // order. Length MUST equal the registry entry's `joint_count`.
  repeated float angles_rad = 1;
}
