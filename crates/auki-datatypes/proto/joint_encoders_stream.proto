syntax = "proto3";

package auki.joint_encoders_stream;

// Joint-encoder substream payload `T` for `/auki/stream/0.1.0`. The
// producer emits one `JointEncodersFrame` per encoder sample;
// consumers (Park) decode and feed angles into FK against their URDF.
// The frame's timestamp and sequence ride in
// `auki.stream.Frame { timestamp_ns, seq, payload: bytes }` — this
// message IS the bytes inside `Frame.payload`.
//
// Joint ordering is producer-defined and immutable per stream; the
// `SensorRegistryEntry`'s `JointEncoders` body — pinned by
// `(sensor_id, sensor_hash)` at handshake — pins vector length via
// `joint_count` and is the single source of interpretation. Mapping
// joint indices to URDF links is a consumer-side concern.
//
// Symmetric with the on-disk
// `auki.joint_encoders.JointEncodersLogEntry` — same
// `repeated float angles_rad` shape on disk and on wire. Mirrors the
// point-cloud pattern (Migration Steps 2/3) where wire and disk
// payloads have identical shape and exist as separate proto packages
// only so wire and log code paths dispatch on distinct Rust types.
// Symmetry is locked by the `joint_encoders_disk_wire_byte_identical`
// test in `auki-datatypes`.
//
// Field number ledger (never reuse, never renumber):
//   JointEncodersFrame.angles_rad = 1

message JointEncodersFrame {
  // Joint angle readings in radians, indexed in the producer's emit
  // order. Length MUST equal the registry entry's `joint_count`.
  repeated float angles_rad = 1;
}
