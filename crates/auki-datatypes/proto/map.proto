syntax = "proto3";

package auki.map;

// One append-only, mergeable change to a map. `timestamp_ns` is supplied by
// the log framing; this payload deliberately contains no peer identity, so it
// can be materialized and relayed by any peer.
message MapUpdate {
  // Ordinary commutative evidence deltas. Producers MUST leave this empty
  // when `checkpoint` is present. Keeping checkpoints in a new field makes
  // them safe for older consumers: they see an empty additive update instead
  // of accidentally adding absolute checkpoint evidence.
  repeated VoxelChunkUpdate voxel_chunks = 1;

  // An ordered full-state barrier. Applying it atomically replaces all prior
  // voxel state before subsequent `voxel_chunks` entries are accumulated.
  VoxelMapCheckpoint checkpoint = 2;
}

// Complete sparse materialization of a voxel map at one log position. A
// retained replay window is self-contained when it begins with a checkpoint
// and contains every subsequent update through its requested end position.
message VoxelMapCheckpoint {
  repeated VoxelChunkSnapshot voxel_chunks = 1;
}

message VoxelChunkSnapshot {
  sint32 chunk_x = 1;
  sint32 chunk_y = 2;
  sint32 chunk_z = 3;
  repeated VoxelSnapshot voxels = 4;
}

message VoxelSnapshot {
  uint32 x = 1;
  uint32 y = 2;
  uint32 z = 3;
  double occupancy_evidence = 4;
  repeated SemanticEvidence semantics = 5;
  ColorEvidence color = 6;
}

message SemanticEvidence {
  uint32 class_id = 1;
  double evidence = 2;
}

// A sparse update to one fixed-size chunk of a voxel map. The chunk coordinate
// is in map-grid chunk units; `voxels` use zero-based coordinates local to it.
message VoxelChunkUpdate {
  sint32 chunk_x = 1;
  sint32 chunk_y = 2;
  sint32 chunk_z = 3;
  repeated VoxelDelta voxels = 4;
}

// Evidence deltas are summed per voxel. Positive occupancy_delta means an
// observed surface; negative means traversed free space. Consumers must not
// clamp stored evidence, preserving deterministic replay and commutative merge.
message VoxelDelta {
  uint32 x = 1;
  uint32 y = 2;
  uint32 z = 3;
  float occupancy_delta = 4;
  repeated SemanticDelta semantics = 5;
  ColorEvidenceDelta color = 6;
}

// Additive weighted linear-light RGB evidence. Producers convert source sRGB
// samples to linear light, multiply each channel by `weight_delta`, and add
// the four fields independently. This makes color updates replayable and
// mergeable without last-writer-wins ordering.
message ColorEvidenceDelta {
  float red_sum_delta = 1;
  float green_sum_delta = 2;
  float blue_sum_delta = 3;
  float weight_delta = 4;
}

// Full accumulated color state stored at a checkpoint barrier. A consumer
// renders `channel_sum / weight` when weight is positive.
message ColorEvidence {
  double red_sum = 1;
  double green_sum = 2;
  double blue_sum = 3;
  double weight = 4;
}

// Optional evidence for an application-defined semantic class. Class labels
// live in the Map Registry, not in individual updates.
message SemanticDelta {
  uint32 class_id = 1;
  float evidence_delta = 2;
}
