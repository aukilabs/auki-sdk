syntax = "proto3";

package auki.point_cloud;

// Point-cloud payload — used on both disk (Sensor Log segment payload
// for a log whose registry entry has body kind `point_cloud`) and on
// the wire (the libp2p `/auki/auth/1/stream/0.2.0` substream payload, raw CDR
// `sensor_msgs/PointCloud2` per Dagaz D2). One type, one byte shape;
// the framing's `timestamp_ns` carries the frame timestamp on both
// paths.
//
// Opaque-bytes-only (Step 3, 2026-05-08): the byte stream is the single
// thing the SDK persists / transmits per frame. Interpretation
// (`fields`, `point_step`, `is_bigendian`, `frame_id`) comes from the
// SensorRegistryEntry's `PointCloud` body that the log's manifest or
// stream's accept pins via `(sensor_id, sensor_hash)`. Per-frame layout
// (`row_step`, `height`, `width`, `is_dense`) rides inside the CDR
// payload when consumers parse it on their side.
//
// Field number ledger (never reuse, never renumber):
//   Data.data = 1

message Data {
  bytes data = 1;
}
