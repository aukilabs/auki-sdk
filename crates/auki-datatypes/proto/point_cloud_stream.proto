syntax = "proto3";

package auki.point_cloud_stream;

// PointCloud-stream substream payload `T` — Dagaz D2 = raw CDR. The
// producer forwards a CDR-encoded `sensor_msgs/PointCloud2` ROS message
// verbatim; consumers (Park, future Sentinel) parse CDR on their side.
// The SDK doesn't decode or interpret these bytes; the shape mirrors
// `PinholeCameraLogEntry { frame }` for symmetry.
//
// Per-frame layout (`row_step`, `height`, `width`, `is_dense`) rides
// inside the CDR payload. Sensor bootstrap-time fields (`fields[]`,
// `point_step`, `is_bigendian`, `frame_rate_hz`, `frame_id`) live in
// the producer's `SensorBody::PointCloud` registry entry.
//
// Field number ledger (never reuse, never renumber):
//   PointCloudFrame.bytes = 1

message PointCloudFrame {
  bytes bytes = 1;
}
