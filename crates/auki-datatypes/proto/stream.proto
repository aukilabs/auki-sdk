syntax = "proto3";

package auki.stream;

// libp2p substream protocol envelope for `/auki/stream/0.2.0`.
//
// Each substream is a sequence of length-prefixed [`StreamMessage`]
// values (4-byte big-endian u32 length + protobuf-encoded body). The
// substream lifetime IS the subscription's lifetime (grimsby D1):
// initiator opens the substream, writes a `Request` as the first
// message, the responder either declines-and-closes or starts pushing
// `StreamEntry` messages until close.
//
// Per-substream `T` (mono-T per grimsby D1 / Dagaz D1): the consumer
// resolves the producer's `StreamManifest.sensor_hash` against its
// Sensor Registry, or `StreamManifest.resource_id` against the producer's
// Resource Catalog, to learn which payload type `StreamEntry.payload` carries.
// The SDK runtime decodes `StreamEntry.payload` (a length-bounded `bytes`
// field) as the matching prost type from `auki-datatypes` (e.g.
// `CameraFrame`, `PointCloudFrame`, `SpatialTransform`).
//
// Field number ledger (never reuse, never renumber):
//   StreamRequest.sensor_id      = 1 (legacy; use resource_id + source_peer_id)
//   StreamRequest.resource_id    = 2
//   StreamRequest.source_peer_id = 3
//   StreamRequest.read_from      = 4..5 (oneof: latest=4 unit, from_start=5 unit, from_timestamp=6 int64)
//   StreamManifest.sensor_id          = 1
//   StreamManifest.sensor_hash        = 2
//   StreamManifest.clock_id           = 3
//   StreamManifest.clock_hash         = 4
//   StreamManifest.frame_id           = 5
//   StreamManifest.frame_hash         = 6
//   StreamManifest.resource_id        = 7
//   StreamManifest.payload            = 8
//   StreamManifest.from_frame_id      = 9
//   StreamManifest.from_frame_hash    = 10
//   StreamManifest.to_frame_id        = 11
//   StreamManifest.to_frame_hash      = 12
//   StreamManifest.writer_mode        = 13
//   StreamManifest.expected_rate_hz   = 14
//   StreamEntry.timestamp_ns         = 1
//   StreamEntry.seq                  = 2
//   StreamEntry.payload              = 3
//   StreamMessage.<oneof variant> = 1..5

// ReadFrom oneof sub-messages for StreamRequest.
message ReadFromLatest {}
message ReadFromStart {}
message ReadFromTimestamp {
  int64 timestamp_ns = 1;
}

message StreamRequest {
  string sensor_id = 1;
  string resource_id = 2;
  string source_peer_id = 3;
  oneof read_from {
    ReadFromLatest latest = 4;
    ReadFromStart from_start = 5;
    ReadFromTimestamp from_timestamp = 6;
  }
}

message StreamManifest {
  string sensor_id = 1;
  string sensor_hash = 2;
  string clock_id = 3;
  string clock_hash = 4;
  string frame_id = 5;
  string frame_hash = 6;
  string resource_id = 7;
  string payload = 8;
  string from_frame_id = 9;
  string from_frame_hash = 10;
  string to_frame_id = 11;
  string to_frame_hash = 12;
  string writer_mode = 13;
  uint32 expected_rate_hz = 14;
  // Present for map_update streams. Together these pin the immutable Map
  // Registry contract used to decode and merge every payload.
  string map_peer_id = 15;
  string map_id = 16;
  string map_hash = 17;
  // Full clock ownership for exact RegistryRef validation. Older stream kinds
  // historically implied the owner; all new manifests populate this field.
  string clock_peer_id = 18;
}

message DeclineReason {
  oneof kind {
    SensorNotFound sensor_not_found = 1;
    SensorUnavailable sensor_unavailable = 2;
    ProducerShuttingDown producer_shutting_down = 3;
    Other other = 4;
  }

  message SensorNotFound {}
  message SensorUnavailable {}
  message ProducerShuttingDown {}
  message Other {
    string detail = 1;
  }
}

message EndReason {
  oneof kind {
    SourceEnded source_ended = 1;
    ProducerShuttingDown producer_shutting_down = 2;
    SessionEnded session_ended = 3;
    ProducerError producer_error = 4;
  }

  message SourceEnded {}
  message ProducerShuttingDown {}
  message SessionEnded {}
  message ProducerError {
    string detail = 1;
  }
}

message StreamEntry {
  int64 timestamp_ns = 1;
  uint64 seq = 2;
  bytes payload = 3;
}

message StreamMessage {
  oneof variant {
    StreamRequest request = 1;
    StreamManifest accept = 2;
    DeclineReason decline = 3;
    StreamEntry entry = 4;
    EndReason end_of_stream = 5;
  }
}
