[package]
name = "auki-domain-py"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for `auki-domain` — exposes the cluster membership document type to Python daemons."

[lib]
# `cdylib` makes the crate build as a Python native extension; `rlib`
# keeps it usable from Rust (`cargo test` against the in-tree crate,
# which links Python via the `auto-initialize` dev-feature). Lib name
# is `auki_domain` — same as the Python module name. Distinct from
# `auki-network-py`'s `auki_network_py` so the two PyO3 wrappers can
# both live in the workspace.
name = "auki_domain"
crate-type = ["cdylib", "rlib"]

[features]
# `extension-module` tells PyO3 to skip linking the Python runtime —
# symbols are resolved at import time by the host interpreter. Default
# is empty so `cargo test` can link Python (`auto-initialize`).
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
# Renamed via `package =` so the upstream Rust crate's name doesn't
# collide with our own lib name `auki_domain`.
auki-domain-rs = { package = "auki-domain", path = "../auki-domain" }
# `PeerId` parsing on the Python ↔ Rust seam.
libp2p-identity = { version = "0.2", default-features = false, features = ["ed25519", "peerid", "serde"] }
# `Multiaddr` parsing for the Python `multiaddrs` kwarg.
multiaddr = "0.18"
# JSON round-trip for the `to_json` / `from_json` Python methods.
serde_json = "1"
# `abi3-py38` builds a stable-ABI extension that works on Python 3.8+
# without rebuilding per minor version.
pyo3 = { version = "0.22", features = ["abi3-py38"] }

[dev-dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
