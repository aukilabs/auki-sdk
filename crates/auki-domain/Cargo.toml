[package]
name = "auki-domain"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Domain lifecycle for the Auki SDK — Domain identity (wallet-scoped), creation (`init_domain`), joining (`join_domain`), Manager/Member roles, heartbeats, live Cluster Registry, and Manager failover. Greenland quest implementation; T1 lands in PR 1."

[dependencies]
auki-identity = { path = "../auki-identity" }
# `swarm` brings the libp2p Swarm + Behaviour and the ClusterRuntime
# constructor that `init_domain` calls into; `discovery_client` brings
# the HTTP client `init_domain` drives. Both required — `init_domain`
# is the sole sanctioned constructor for a `ClusterRuntime`, and it
# can only build one by going through Discovery.
auki-network = { path = "../auki-network", features = ["discovery_client", "swarm"] }
multiaddr = "0.18"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
