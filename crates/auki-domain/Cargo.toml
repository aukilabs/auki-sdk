[package]
name = "auki-domain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Authenticated Domain lifecycle and retained Auki application protocols."

[features]
default = ["native_runtime"]
native_runtime = [
    "dep:auki-p2p",
    "dep:auki-protocols",
    "dep:auki-datatypes",
    "dep:auki-hash",
    "dep:auki-registry",
    "dep:auki-session",
    "dep:prost",
    "dep:tokio",
    "dep:tokio-util",
    "dep:futures",
    "dep:chrono",
    "dep:parking_lot",
    "dep:tracing",
    "dep:uuid",
]

[dependencies]
auki-p2p = { path = "../auki-p2p", optional = true }
auki-datatypes = { path = "../auki-datatypes", optional = true }
auki-hash = { path = "../auki-hash", optional = true }
auki-protocols = { path = "../auki-protocols", optional = true, features = [
    "blob",
    "catalog",
    "info",
    "message",
    "registry",
    "stream",
] }
auki-registry = { path = "../auki-registry", optional = true }
# `Domain` composes a `&Peer` + `&Session` from auki-session and serves their
# retained application protocols; the dependency points domain → session.
auki-session = { path = "../auki-session", optional = true }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }
futures = { version = "0.3", optional = true }
chrono = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
uuid = { workspace = true, optional = true }
prost = { version = "0.13", optional = true }

[dev-dependencies]
auki-layout = { path = "../auki-layout" }
auki-manifests = { path = "../auki-manifests" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util", "time"] }
tempfile = "3"
# Authentication boundary tests drive an intentionally unauthenticated raw
# Swarm to prove application protocols cannot be reached before admission.
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "quic", "noise", "yamux", "macros"] }
libp2p-stream = "=0.4.0-alpha"
futures = "0.3"
jsonwebtoken = "9"
hex = "0.4"
