[package]
name = "auki-domain"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cluster lifecycle for the Auki SDK — cluster membership document, join protocol, Manager state machine, peer-side heartbeat, successor election, Manager-handoff orchestration."

[dependencies]
auki-identity = { path = "../auki-identity" }
# `swarm` brings the libp2p Swarm + Behaviour and the NetworkRuntime
# the cluster manager drives; `discovery_client` brings the HTTP
# client. Both required for `ClusterManager::create_cluster`.
auki-network = { path = "../auki-network", features = ["discovery_client", "swarm"] }
# `ClusterMembership` carries libp2p `PeerId`s on the wire; the
# `serde` feature pins their canonical string form so the JSON
# document is interoperable across languages.
libp2p-identity = { version = "0.2", default-features = false, features = ["ed25519", "peerid", "serde"] }
multiaddr = "0.18"
serde = { version = "1", features = ["derive"] }
# Cluster Manager's join handler serializes the membership document
# into the wire response; cluster_manager's join_cluster parses the
# Manager's gossiped membership_json. Promoted from dev-dep.
serde_json = "1"
thiserror = "2"
# `tokio::spawn` + `tokio::time::interval` drive the Manager-side
# Discovery heartbeat tick.
tokio = { version = "1", features = ["rt", "time", "macros"] }
# `prost::Message` trait bound on `ClusterManager::open_stream<T>` —
# the same bound `NetworkRuntime::open_stream` carries on `T`. Pulled
# directly so the public method signature can name it without
# requiring callers to dep on auki-network.
prost = "0.13"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
# Integration tests need to drive a Swarm + listen for events directly
# (waiting for the OS-chosen TCP port to materialize before calling
# `ClusterManager::create_cluster`). Matches `auki-network`'s libp2p
# feature set.
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "quic", "noise", "yamux", "macros"] }
futures = "0.3"
