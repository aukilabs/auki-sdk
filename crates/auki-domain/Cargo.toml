[package]
name = "auki-domain"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cluster lifecycle for the Auki SDK — cluster membership document, join protocol, Manager state machine, peer-side heartbeat, successor election, Manager-handoff orchestration."

[dependencies]
libp2p-identity = { version = "0.2", default-features = false, features = ["ed25519", "peerid", "serde"] }
multiaddr = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[lib]
name = "auki_domain"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["uniffi"]
uniffi = ["dep:uniffi"]
cli = ["uniffi", "uniffi/cli"]
wasm = ["dep:wasm-bindgen"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
auki-identity = { path = "../auki-identity", default-features = false }
auki-hash = { path = "../auki-hash", default-features = false }
auki-jcs = { path = "../auki-jcs", default-features = false }
# `swarm` brings the libp2p Swarm + Behaviour and the NetworkRuntime
# the cluster manager drives; `discovery_client` brings the HTTP
# client. Both required for `ClusterManager::create_cluster`.
auki-network = { path = "../auki-network", default-features = false, features = ["discovery_client", "swarm"] }
auki-proto = { path = "../auki-proto", default-features = false }
auki-registry = { path = "../auki-registry", default-features = false }
auki-time = { path = "../auki-time", default-features = false }
futures = "0.3"
thiserror = "2"
# `tokio::spawn` + `tokio::time::interval` drive the Manager-side
# Discovery heartbeat tick.
tokio = { version = "1", features = ["rt", "time", "macros"] }
# `prost::Message` trait bound on `ClusterManager::open_stream<T>` —
# the same bound `NetworkRuntime::open_stream` carries on `T`. Pulled
# directly so the public method signature can name it without
# requiring callers to dep on auki-network.
prost = "0.13"
uniffi = { version = "0.31", features = ["tokio"], optional = true }

[dev-dependencies]
auki-layout = { path = "../auki-layout", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tempfile = "3"
# Integration tests need to drive a Swarm + listen for events directly
# (waiting for the OS-chosen TCP port to materialize before calling
# `ClusterManager::create_cluster`). Matches `auki-network`'s libp2p
# feature set.
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "quic", "noise", "yamux", "macros"] }
futures = "0.3"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[[test]]
name = "surface"
path = "tests/surface.rs"
required-features = ["uniffi"]
