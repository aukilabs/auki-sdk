[generators.uniffi]
features = ["cli"]
bindgen_bin = "uniffi-bindgen"

[generators.wasm_pack]
features = ["wasm"]
target = "web"

[bindings.python]
enabled = true
generator = "uniffi"
template_dir = "bindings/python"
templates = ["pyproject.toml.tmpl", "setup.py.tmpl", "README.md.tmpl"]

[bindings.swift]
enabled = true
generator = "uniffi"
template_dir = "bindings/swift"
templates = [
  "Package.swift.tmpl",
  "Sources/AukiDomainSignaledWebRTC/AukiSignaledDomainWebRTC.swift.tmpl",
]

[bindings.javascript]
enabled = true
generator = "wasm_pack"
template_dir = "bindings/javascript"
templates = [
  "package.json.tmpl",
  "README.md.tmpl",
  "index.js.tmpl",
  "index.d.ts.tmpl",
  "test/browser-domain-peer-state.test.mjs.tmpl",
  "test/browser-domain-peer-join.test.mjs.tmpl",
  "test/browser-domain-peer-catalogs.test.mjs.tmpl",
  "test/browser-domain-peer-stream.test.mjs.tmpl",
  "test/domain-helpers.test.mjs.tmpl",
  "test/domain-client-request-response.test.mjs.tmpl",
  "test/full-domain-generated.test.mjs.tmpl",
]
type_sources = ["src/adapter.ts.tmpl"]
smoke = "bindings/javascript/smoke.mjs"
