[package]
name = "auki-geometry"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure spatial math helpers for Auki frame conventions and pose operations."

[dependencies]
auki-proto = { path = "../auki-proto" }
auki-registry = { path = "../auki-registry", default-features = false }
serde = "1"
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[lib]
name = "auki_geometry"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["uniffi"]
uniffi = ["dep:uniffi", "dep:thiserror"]
cli = ["uniffi", "uniffi/cli"]
wasm = ["dep:wasm-bindgen"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "0.31", optional = true }
thiserror = { version = "2", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[[test]]
name = "surface"
path = "tests/surface.rs"
required-features = ["uniffi"]
