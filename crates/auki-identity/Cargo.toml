[package]
name = "auki-identity"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wallet primitive for the Auki SDK — ed25519 keypairs, signing, deterministic child derivation, and signed creation certs. WASM-friendly."

[dependencies]
auki-hash = { path = "../auki-hash" }
auki-jcs = { path = "../auki-jcs" }
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "std", "zeroize", "rand_core"] }
rand_core = { version = "0.6", features = ["std", "getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
