[package]
name = "auki-layout-py"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for `auki-layout`'s on-disk path helpers — pure-function wrappers around `registries_root`, `sensor_entry_path`, `clock_entry_path`, `frame_entry_path`, `session_root`, `timetransform_log_path`, `sensorlog_path`, `poselog_path`, `detection_log_path`, and `id_to_segment`. Lets a Python consumer (e.g. the ESL detector loop) compute SDK-canonical paths without re-implementing the `__`-substitution + directory-name conventions."

[lib]
name = "auki_layout"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
auki-layout-rs = { package = "auki-layout", path = "../auki-layout" }
pyo3 = { version = "0.22", features = ["abi3-py38"] }

[dev-dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
