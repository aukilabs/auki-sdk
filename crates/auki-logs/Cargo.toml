[package]
name = "auki-logs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Generic segmented ring-buffer log primitive — manifest header + 1s segment files + retention eviction."

[dependencies]
auki-jcs = { path = "../auki-jcs" }
serde = "1"
serde_json = "1"
ciborium = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
