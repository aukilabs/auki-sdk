<!doctype html>
<meta charset="utf-8" />
<script type="module">
  import init, { BrowserDomainSession } from "../pkg-web/auki_network_browser_wasm.js";

  const params = new URLSearchParams(location.search);
  const discovery = params.get("discovery");
  const domain = params.get("domain") ?? "browser-join-smoke";
  const seed = new Uint8Array(32).fill(3);

  try {
    await init();
    const session = new BrowserDomainSession(seed);
    const result = await session.joinDomain(discovery, domain);
    document.body.dataset.result = JSON.stringify(result);
    document.body.textContent = JSON.stringify(result);
  } catch (err) {
    document.body.dataset.result = JSON.stringify({ ok: false, error: String(err) });
    document.body.textContent = String(err);
  }
</script>
