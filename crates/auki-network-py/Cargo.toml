[package]
name = "auki-network-py"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for `auki-network` — exposes the Discovery service HTTP client to Python daemons."

[lib]
# `cdylib` for the Python native extension, `rlib` for in-workspace
# Rust consumers. Lib name `auki_network_py` is distinct from
# `auki-network`'s own lib name so both can be direct deps in one
# workspace. Python module name stays `auki_network` via maturin's
# `module-name = "auki_network"` in pyproject.toml.
name = "auki_network_py"
crate-type = ["cdylib", "rlib"]

[features]
# `extension-module` skips linking Python (the host interpreter
# resolves at import time). Default-empty so `cargo test` can link
# Python via the dev `auto-initialize` feature.
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
# Renamed via `package =` so the upstream crate's name doesn't
# collide with our own lib name.
auki-network-rs = { package = "auki-network", path = "../auki-network", features = ["discovery_client"] }
# `PeerId` parsing on the Python ↔ Rust seam.
libp2p-identity = { version = "0.2", default-features = false, features = ["ed25519", "peerid", "serde"] }
# `Multiaddr` parsing for the Python multiaddr string kwargs.
multiaddr = "0.18"
# Process-wide tokio runtime that drives the async Discovery client
# calls behind a sync Python surface.
tokio = { version = "1", features = ["rt-multi-thread"] }
# `abi3-py38` builds a stable-ABI extension that works on Python 3.8+
# without rebuilding per minor version.
pyo3 = { version = "0.22", features = ["abi3-py38"] }

[dev-dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
