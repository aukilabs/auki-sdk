[package]
name = "auki-network"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Networking substrate for the Auki SDK — peer identity (derived from a wallet), reachability records, named capabilities, and (with the `swarm` feature) a libp2p Swarm builder for TCP/QUIC transport."

[lib]
name = "auki_network"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Default native builds exercise the UniFFI surface. Rust consumers that want
# only the direct API should depend with `default-features = false`.
default = ["uniffi"]
uniffi = [
    "dep:uniffi",
    "dep:thiserror",
]
cli = ["uniffi", "uniffi/cli"]
# Browser builds expose identity/protocol helpers to JavaScript. Browser
# transport is implemented by the generated JS package using jslibp2p.
wasm = [
    "auki-identity/wasm",
    "dep:getrandom",
    "dep:js-sys",
    "dep:wasm-bindgen",
]
# Stream protocol wire types live in `auki-datatypes` (Step 2 of the
# migration); pulled in alongside libp2p so the substream protocol can
# encode/decode prost messages directly. base64 is no longer needed
# under swarm — protobuf handles binary natively.
swarm = ["dep:libp2p", "dep:libp2p-stream", "dep:libp2p-allow-block-list", "dep:thiserror", "dep:tokio", "dep:futures", "dep:auki-datatypes", "dep:auki-time", "dep:prost"]
# Native-only probe for proving browser peers can dial an SDK-owned WebRTC
# Direct listener before the Domain adapter stops failing closed.
browser_probe = ["swarm", "dep:libp2p-webrtc", "dep:rand"]
# Per-machine identifier derivation (ansuz #5). Non-WASM — pulls in the
# `mac_address` crate, which uses platform-specific syscalls
# (`getifaddrs` / `GetAdaptersAddresses`) to enumerate interfaces.
app_instance = ["dep:mac_address"]
# Vinland Batch 1 piece #2 — REST client for Discovery
# (`aukilabs/discovery`). Pulls in `reqwest` (async HTTP), `base64`
# (32-byte pubkey + 64-byte signature on the wire), `auki-jcs` (RFC
# 8785 canonical bytes for the signed payload), and `thiserror`. Async
# only — the caller drives a tokio runtime; the SDK does not own one.
# Opt-in because it's a fairly heavy dep set that not every consumer
# needs.
discovery_client = ["dep:reqwest", "dep:base64", "dep:auki-jcs", "dep:thiserror", "dep:eventsource-stream", "dep:futures", "dep:tokio", "dep:percent-encoding"]

[dependencies]
auki-identity = { path = "../auki-identity", default-features = false }
libp2p-identity = { version = "0.2", default-features = false, features = ["ed25519", "peerid", "serde"] }
multiaddr = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `wasm` feature
getrandom = { version = "0.2", features = ["js"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

# `swarm` feature
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "quic", "noise", "yamux", "identify", "ping", "relay", "request-response", "json", "macros", "ed25519"], optional = true }
libp2p-webrtc = { version = "0.9.0-alpha.1", default-features = false, features = ["tokio"], optional = true }
# Cluster trust boundary at the libp2p layer. Inbound and outbound
# connections from peer-ids not on `ClusterDoc.peers` are refused at
# the `NetworkBehaviour` layer — the noise handshake completes (libp2p
# constraint: peer-id is bound to the pubkey in noise) but no
# protocol-level event fires, so outsiders never reach `identify`,
# `/auki/cluster/0.0.1`, `/auki/stream/0.1.0`, or anything else on the
# swarm. `cluster_runtime` populates the allow-list from
# `ClusterDoc.peers` on spawn and on every Discovery-SSE update.
# Not exposed as a feature on the `libp2p` umbrella crate; depend
# directly. Version paired with libp2p 0.56.
libp2p-allow-block-list = { version = "0.6", optional = true }
# `libp2p-stream` ships separately (the libp2p umbrella crate doesn't re-export
# it). 0.4.0-alpha pairs with libp2p 0.56 / libp2p-swarm 0.47. Pre-1.0; pin
# exactly until libp2p stabilizes the surface.
libp2p-stream = { version = "=0.4.0-alpha", optional = true }
thiserror = { version = "2", optional = true }
# Runtime + select!/sleep/interval/oneshot for `cluster_runtime`. Pulled in
# only with `swarm`; libp2p's `tokio` feature already brings tokio into
# the dep graph, this just exposes the bits we use directly.
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"], optional = true }
# `StreamExt` for polling `swarm.next()` in the runtime task.
futures = { version = "0.3", default-features = false, optional = true }
rand = { version = "0.8", optional = true }
# Stream-protocol wire types — `CameraFrame`, `PointCloudFrame`,
# `StreamMessage` envelope. Step 2 of the auki-datatypes migration
# moves these from this crate's hand-rolled serde structs to
# auki-datatypes-owned prost types.
auki-datatypes = { path = "../auki-datatypes", optional = true }
# NTP-style samples derived from heartbeat echoes.
auki-time = { path = "../auki-time", optional = true }
# Encode/decode prost messages on the substream wire.
prost = { version = "0.13", optional = true }

# `app_instance` feature
mac_address = { version = "1", optional = true }

# `discovery_client` feature
# rustls-tls (not the default native-tls) keeps us off OpenSSL for
# cross-platform reproducibility; HTTPS isn't strictly required for
# ansuz LAN deploys but the cost is small and Discovery may grow
# beyond the LAN later. The `stream` feature exposes
# `Response::bytes_stream` for the SSE long-poll path used by
# `discovery_client::subscribe`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
base64 = { version = "0.22", default-features = false, features = ["std"], optional = true }
auki-jcs = { path = "../auki-jcs", optional = true }
# Parses Server-Sent Events from a `Stream<Item = Result<Bytes, _>>`
# into a stream of typed SSE events. Picked over `reqwest-eventsource`
# because the latter adds reconnection-on-drop, which the
# subscribe decision (caller owns retry; see parking_lot.md) explicitly
# rejects. Pure parser; no HTTP knowledge of its own. Pulled in
# only with `discovery_client`.
eventsource-stream = { version = "0.2", optional = true }
# Path-segment percent-encoding for cluster_name. Greenland T1's
# wallet-scoped Domain identities are `{wallet_id}/{name}` — the literal
# slash must be encoded as `%2F` before riding in a URL path segment, or
# Discovery's router sees four path components instead of three and 404s.
percent-encoding = { version = "2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "0.31", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[[example]]
name = "browser_probe_listener"
path = "examples/browser_probe_listener.rs"
required-features = ["browser_probe"]

[dev-dependencies]
tempfile = "3"
# For the swarm tests (require `--features swarm`).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"
