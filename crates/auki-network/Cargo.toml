[package]
name = "auki-network"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Retained Auki application protocol codecs and plain networking types."

[features]
# Application codecs are opt-in so identity-only consumers keep a small API.
default = []
# Enables UniFFI proc-macros on the retained PeerIdentity compatibility
# surface. When off, the crate has no UniFFI dependency in its graph.
#
# Propagates to `auki-identity/swift-bindings` because PR A's
# `PeerIdentity::from_wallet(wallet: Arc<Wallet>)` accepts a UniFFI
# Object defined in the identity crate; without the upstream feature
# enabled there's no `FfiConverterArc<UT>` for `Wallet` and the
# `uniffi::export` here fails to compile. `use_remote_type!` (in
# `src/lib.rs`) reuses that upstream impl.
swift-bindings = ["dep:uniffi", "dep:anyhow", "auki-identity/swift-bindings"]
# Retained application payload codecs and business validation, independent of
# transport. The authenticated Domain runtime calls these helpers over streams
# it already authenticated.
protocol-codecs = ["dep:futures", "dep:thiserror", "dep:auki-datatypes", "dep:prost", "dep:auki-manifests", "dep:auki-registry", "dep:auki-jcs"]
# Per-machine identifier derivation (ansuz #5). Non-WASM — pulls in the
# `mac_address` crate, which uses platform-specific syscalls
# (`getifaddrs` / `GetAdaptersAddresses`) to enumerate interfaces.
app_instance = ["dep:mac_address"]

[dependencies]
auki-identity = { path = "../auki-identity" }
auki-p2p = { path = "../auki-p2p" }
libp2p-identity = { version = "0.2", default-features = false, features = ["ed25519", "peerid", "serde"] }
multiaddr = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional — pulled in only when the `swift-bindings` feature is on.
# Carries the UniFFI proc-macros for `bindings/swift/auki-network-swift`.
# Default-off so non-Swift consumers (Python sidecars, Rust daemons) don't
# pull uniffi into their dep graph.
uniffi = { version = "0.31", features = ["tokio"], optional = true }
# Used by the `try_lift` arms of `uniffi::custom_type!` declarations when
# `swift-bindings` is enabled. Error handling for the custom types that cross
# the FFI boundary.
anyhow = { version = "1", optional = true }

thiserror = { version = "2", optional = true }
futures = { version = "0.3", default-features = false, optional = true }
# Stream-protocol wire types — `CameraFrame`, `PointCloudFrame`, and the
# `StreamMessage` envelope.
auki-datatypes = { path = "../auki-datatypes", optional = true }
# Log manifest shapes (PoseWriterMode, etc.) — used by the new catalog
# row building blocks (Variant, PoseBlock, …) in resources_protocol.
# Pulled in with `protocol-codecs`.
auki-manifests = { path = "../auki-manifests", optional = true }
# Registry reference types (RegistryRef, LogRef) for new ResourceEntry
# manifest pointers. Pulled in with `protocol-codecs` alongside auki-manifests.
auki-registry = { path = "../auki-registry", optional = true }
# Canonical JSON for locked catalog fixtures and codec conformance tests.
auki-jcs = { path = "../auki-jcs", optional = true }
# Encode/decode prost messages on the substream wire.
prost = { version = "0.13", optional = true }

# `app_instance` feature.
mac_address = { version = "1", optional = true }

[dev-dependencies]
futures = "0.3"
# Async codec tests only; the crate owns no Tokio runtime in production.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# serde_json needed by new_blocks_tests helper.
serde_json = "1"
# RegistryRef / LogRef used in ResourceEntry tests.
auki-registry = { path = "../auki-registry" }
# PoseSource / PoseWriterMode used in ResourceEntry tests.
auki-manifests = { path = "../auki-manifests" }

[[bin]]
name = "regen_locked_fixtures"
path = "src/bin/regen_locked_fixtures.rs"
required-features = ["protocol-codecs"]

[[test]]
name = "locked_json"
path = "tests/locked_json.rs"
required-features = ["protocol-codecs"]
