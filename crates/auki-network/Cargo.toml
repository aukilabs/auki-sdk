[package]
name = "auki-network"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Networking substrate for the Auki SDK — peer identity (derived from a wallet), reachability records, named capabilities, and (with the `swarm` feature) a libp2p Swarm builder for TCP/QUIC transport."

[features]
# Default-off so M0 stays WASM-friendly (Console derives peer-id without
# pulling in libp2p's transport stack). Daemons opt in.
default = []
# Stream protocol wire types live in `auki-datatypes` (Step 2 of the
# migration); pulled in alongside libp2p so the substream protocol can
# encode/decode prost messages directly. base64 is no longer needed
# under swarm — protobuf handles binary natively.
swarm = ["dep:libp2p", "dep:libp2p-stream", "dep:thiserror", "dep:tokio", "dep:futures", "dep:auki-datatypes", "dep:prost"]
# Per-machine identifier derivation (ansuz #5). Non-WASM — pulls in the
# `mac_address` crate, which uses platform-specific syscalls
# (`getifaddrs` / `GetAdaptersAddresses`) to enumerate interfaces.
app_instance = ["dep:mac_address"]
# Vinland Batch 1 piece #2 — REST client for Discovery
# (`aukilabs/discovery`). Pulls in `reqwest` (async HTTP), `base64`
# (32-byte pubkey + 64-byte signature on the wire), `auki-jcs` (RFC
# 8785 canonical bytes for the signed payload), and `thiserror`. Async
# only — the caller drives a tokio runtime; the SDK does not own one.
# Opt-in because it's a fairly heavy dep set that not every consumer
# needs.
discovery_client = ["dep:reqwest", "dep:base64", "dep:auki-jcs", "dep:thiserror"]

[dependencies]
auki-identity = { path = "../auki-identity" }
libp2p-identity = { version = "0.2", default-features = false, features = ["ed25519", "peerid", "serde"] }
multiaddr = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `swarm` feature
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "quic", "noise", "yamux", "identify", "ping", "mdns", "relay", "request-response", "json", "macros", "ed25519"], optional = true }
# `libp2p-stream` ships separately (the libp2p umbrella crate doesn't re-export
# it). 0.4.0-alpha pairs with libp2p 0.56 / libp2p-swarm 0.47. Pre-1.0; pin
# exactly until libp2p stabilizes the surface.
libp2p-stream = { version = "=0.4.0-alpha", optional = true }
thiserror = { version = "2", optional = true }
# Runtime + select!/sleep/interval/oneshot for `cluster_runtime`. Pulled in
# only with `swarm`; libp2p's `tokio` feature already brings tokio into
# the dep graph, this just exposes the bits we use directly.
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"], optional = true }
# `StreamExt` for polling `swarm.next()` in the runtime task.
futures = { version = "0.3", default-features = false, optional = true }
# Stream-protocol wire types — `JpegFrame`, `PointCloudFrame`,
# `StreamMessage` envelope. Step 2 of the auki-datatypes migration
# moves these from this crate's hand-rolled serde structs to
# auki-datatypes-owned prost types.
auki-datatypes = { path = "../auki-datatypes", optional = true }
# Encode/decode prost messages on the substream wire.
prost = { version = "0.13", optional = true }

# `app_instance` feature
mac_address = { version = "1", optional = true }

# `discovery_client` feature
# rustls-tls (not the default native-tls) keeps us off OpenSSL for
# cross-platform reproducibility; HTTPS isn't strictly required for
# ansuz LAN deploys but the cost is small and Discovery may grow
# beyond the LAN later.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
base64 = { version = "0.22", default-features = false, features = ["std"], optional = true }
auki-jcs = { path = "../auki-jcs", optional = true }

[dev-dependencies]
tempfile = "3"
# For the swarm tests (require `--features swarm`).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"
