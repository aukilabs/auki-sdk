[generators.uniffi]
features = ["cli", "message_node"]
bindgen_bin = "uniffi-bindgen"

[generators.wasm_pack]
features = ["wasm"]
target = "web"

[bindings.python]
# Disabled while the existing PyO3 `auki-network-py` package owns the rich
# Python runtime surface. The UniFFI adapter is intentionally small and native.
enabled = false
generator = "uniffi"

[bindings.swift]
enabled = true
generator = "uniffi"
template_dir = "bindings/swift"
templates = ["Package.swift.tmpl"]
build_features = ["message_node"]

[bindings.javascript]
enabled = true
generator = "wasm_pack"
template_dir = "bindings/javascript"
templates = ["package.json.tmpl", "README.md.tmpl", "index.js.tmpl", "index.d.ts.tmpl"]
smoke = "bindings/javascript/smoke.mjs"
