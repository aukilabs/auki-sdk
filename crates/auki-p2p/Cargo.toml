[package]
name = "auki-p2p"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Clean libp2p runtime for the RFC-first Auki peer-to-peer protocol."

[dependencies]
auki-identity = { path = "../auki-identity" }
auki-protocol = { path = "../auki-protocol" }
futures = { version = "0.3", default-features = false }
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "quic", "dns", "websocket", "noise", "yamux", "identify", "ping", "relay", "request-response", "json", "macros", "ed25519"] }
libp2p-identity = { version = "0.2", default-features = false, features = ["ed25519", "peerid", "serde"] }
libp2p-stream = "=0.4.0-alpha"
multiaddr = "0.18"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
