[package]
name = "auki-protocol-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "wasm-bindgen adapter for the pure Auki protocol crate."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
auki-identity = { path = "../auki-identity" }
auki-protocol = { path = "../auki-protocol" }
libp2p-identity = { version = "0.2", default-features = false, features = ["peerid"] }
serde = "1"
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
