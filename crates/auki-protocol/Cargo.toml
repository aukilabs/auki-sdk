[package]
name = "auki-protocol"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pure Auki protocol RFC types, wire framing, validation helpers, and conformance vectors."

[dependencies]
auki-identity = { path = "../auki-identity" }
auki-jcs = { path = "../auki-jcs" }
libp2p-identity = { version = "0.2", default-features = false, features = ["peerid"] }
serde = "1"
serde_json = "1"
