[package]
name = "auki-registry"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sensor and Clock Registry entry shapes + content-addressed on-disk storage."

[dependencies]
auki-jcs = { path = "../auki-jcs", default-features = false }
auki-hash = { path = "../auki-hash", default-features = false }
auki-layout = { path = "../auki-layout", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[lib]
name = "auki_registry"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["uniffi"]
uniffi = ["dep:uniffi", "dep:thiserror"]
cli = ["uniffi", "uniffi/cli"]
wasm = ["dep:wasm-bindgen"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "0.31", optional = true }
thiserror = { version = "2", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[[test]]
name = "surface"
path = "tests/surface.rs"
required-features = ["uniffi"]

[dev-dependencies]
auki-logs = { path = "../auki-logs", default-features = false }
tempfile = "3"
