[package]
name = "auki-registry"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sensor and Clock Registry entry shapes + content-addressed on-disk storage."

[dependencies]
auki-jcs = { path = "../auki-jcs" }
auki-hash = { path = "../auki-hash" }
auki-session = { path = "../auki-session" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
