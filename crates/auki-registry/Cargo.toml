[package]
name = "auki-registry"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sensor and Clock Registry entry shapes + content-addressed on-disk storage."

[dependencies]
auki-jcs = { path = "../auki-jcs" }
auki-hash = { path = "../auki-hash" }
auki-layout = { path = "../auki-layout" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
quick-xml = "0.37"
thiserror = "1"

[dev-dependencies]
auki-logs = { path = "../auki-logs" }
tempfile = "3"
