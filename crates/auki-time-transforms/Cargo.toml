[package]
name = "auki-time-transforms"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "TimeTransform Log specialization + 1 Hz local-clock-read sampler."

[dependencies]
auki-logs = { path = "../auki-logs" }
# `TimeTransformEntry` still encodes via CBOR until Step 6 of the
# auki-datatypes migration moves it to a `.proto`. The `LogPayload` impl
# in this crate calls into ciborium directly; once the type moves, this
# dep goes away.
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `Sampler` integration test in src/lib.rs uses
# `auki_manifests::build_time_transform_log_manifest` to construct the
# log manifest. The builder moved to `auki-manifests` in Step 0 of the
# auki-datatypes migration; production code in this crate doesn't
# depend on it (apps that own a sampler also own the manifest).
auki-manifests = { path = "../auki-manifests" }
