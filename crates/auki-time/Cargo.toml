[package]
name = "auki-time"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Auki SDK time primitives: session clocks, time transforms, NTP-style samples, and TimeTransform Log sampling."

[dependencies]
# `TimeTransformEntry` lives in `auki-proto` since Step 6 of the
# migration (2026-05-08, prost-encoded). Re-exported from this crate
# for short call sites; encoding handled via the `LogPayload` macro
# impl in `auki-proto`.
auki-proto = { path = "../auki-proto" }
# `TimeTransformSource` is manifest metadata since Step 6 — re-exported
# from `auki-manifests` for short call sites.
auki-manifests = { path = "../auki-manifests", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[lib]
name = "auki_time"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["uniffi"]
uniffi = ["dep:uniffi", "dep:thiserror"]
cli = ["uniffi", "uniffi/cli"]
wasm = ["dep:wasm-bindgen"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
auki-registry = { path = "../auki-registry", default-features = false }
auki-logs = { path = "../auki-logs", default-features = false }
libc = "0.2"
uniffi = { version = "0.31", optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[[test]]
name = "surface"
path = "tests/surface.rs"
required-features = ["uniffi"]
