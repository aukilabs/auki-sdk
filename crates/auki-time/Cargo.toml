[package]
name = "auki-time"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Auki SDK time primitives: session clocks, time transforms, NTP-style samples, and TimeTransform Log sampling."

[features]
# Enables UniFFI proc-macros on the public clock-sync value types
# (ClockTransformEstimate, DomainClockDescriptor, DomainClockEstimate,
# DomainClockEstimateError) so they can cross the Rust–Swift boundary.
# When off (default), the crate compiles exactly as today — no UniFFI
# dep in the graph.
swift-bindings = ["dep:uniffi", "dep:anyhow"]

[dependencies]
auki-registry = { path = "../auki-registry" }
auki-logs = { path = "../auki-logs" }
# `TimeTransformEntry` lives in `auki-datatypes` since Step 6 of the
# migration (2026-05-08, prost-encoded). Re-exported from this crate
# for short call sites; encoding handled via the `LogPayload` macro
# impl in `auki-datatypes`.
auki-datatypes = { path = "../auki-datatypes" }
# `TimeTransformSource` is manifest metadata since Step 6 — re-exported
# from `auki-manifests` for short call sites.
auki-manifests = { path = "../auki-manifests" }
libc = "0.2"
# Optional — pulled in only when the `swift-bindings` feature is on.
uniffi = { version = "0.31", features = ["tokio"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
