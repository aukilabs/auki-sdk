[package]
name = "auki-diagnostic-app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Manual direct-TCP proof for one authenticated Auki Domain."

[dependencies]
anyhow = { workspace = true }
auki-domain = { path = "../../crates/auki-domain" }
auki-protocols = { path = "../../crates/auki-protocols", features = ["catalog"] }
auki-p2p = { path = "../../crates/auki-p2p" }
auki-registry = { path = "../../crates/auki-registry" }
auki-session = { path = "../../crates/auki-session" }
clap = { version = "4.5", features = ["derive"] }
jsonwebtoken = "9"
p256 = "0.13"
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
