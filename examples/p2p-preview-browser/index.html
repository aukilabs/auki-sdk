<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auki P2P Preview Browser</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Auki P2P Preview</h1>
          <p id="connection-status">Idle</p>
        </div>
        <div class="actions">
          <button id="connect-button" type="button">Connect</button>
          <button id="subscribe-button" type="button" disabled>Subscribe</button>
          <button id="stop-button" type="button" disabled>Stop</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="panel bootstrap-panel">
          <label for="bootstrap-input">Bootstrap JSON</label>
          <textarea id="bootstrap-input" spellcheck="false"></textarea>
          <div class="row">
            <input id="bootstrap-file" type="file" accept="application/json,.json" />
            <button id="clear-button" type="button">Clear</button>
          </div>
        </aside>

        <section class="panel preview-panel">
          <div class="preview-frame">
            <img id="preview-image" alt="" />
            <div id="preview-empty">No frame</div>
          </div>
          <div class="metrics">
            <div>
              <span>Snapshots</span>
              <strong id="snapshots-received">0</strong>
            </div>
            <div>
              <span>Frames</span>
              <strong id="frames-received">0</strong>
            </div>
            <div>
              <span>Last Frame</span>
              <strong id="last-frame-at">Never</strong>
            </div>
            <div>
              <span>Offer</span>
              <strong id="selected-offer">None</strong>
            </div>
          </div>
        </section>

        <section class="panel state-panel">
          <div class="state-grid">
            <div>
              <span>Local Peer</span>
              <strong id="local-peer">Not started</strong>
            </div>
            <div>
              <span>Peers</span>
              <strong id="peer-count">0</strong>
            </div>
            <div>
              <span>Offers</span>
              <strong id="offer-count">0</strong>
            </div>
            <div>
              <span>Error</span>
              <strong id="last-error">None</strong>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Peer</th>
                  <th>Connected</th>
                  <th>Addresses</th>
                </tr>
              </thead>
              <tbody id="peers-table"></tbody>
            </table>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Kind</th>
                  <th>Domain</th>
                  <th>Offer</th>
                  <th>Payload</th>
                  <th>Access</th>
                </tr>
              </thead>
              <tbody id="offers-table"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
