[package]
name = "auki-portable-echo-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Python adapter for the portable Auki echo protocol"
readme = "README.md"
publish = false

[lib]
name = "auki_portable_echo"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
auki-echo-protocol = { package = "auki-portable-echo", path = ".." }
auki-sdk-binding = { package = "auki-sdk-py", path = "../../../bindings/python/auki-sdk-py" }
auki-sdk-rs = { package = "auki-sdk", path = "../../../crates/auki-sdk" }
parking_lot.workspace = true
pyo3 = { version = "0.22", features = ["abi3-py38"] }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
