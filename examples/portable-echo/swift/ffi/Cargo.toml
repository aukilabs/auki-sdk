[package]
name = "auki-portable-echo-swift"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Swift adapter and umbrella Apple artifact for the portable Auki echo protocol"
publish = false

[lib]
name = "auki_portable_echo_swift"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
cli = ["uniffi/cli"]

[dependencies]
auki-echo-protocol = { package = "auki-portable-echo", path = "../.." }
auki-sdk-binding = { package = "auki-sdk-swift", path = "../../../../bindings/swift/auki-sdk-swift" }
auki-sdk-rs = { package = "auki-sdk", path = "../../../../crates/auki-sdk" }
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
uniffi = { version = "0.31", features = ["tokio"] }
uuid.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]
