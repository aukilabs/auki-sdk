[package]
name = "auki-portable-echo-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Browser Wasm adapter for the portable Auki echo protocol."
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
auki-auth = { path = "../../../crates/auki-auth" }
auki-p2p = { path = "../../../crates/auki-p2p" }
auki-portable-echo-protocol = { path = "../protocol" }
auki-sdk-web = { path = "../../../bindings/web/auki-sdk-web" }
futures = { workspace = true }
futures-timer = { workspace = true }
js-sys = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
