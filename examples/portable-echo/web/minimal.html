<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Minimal Auki echo peer</title>
  </head>
  <body>
    <main>
      <h1>Minimal Auki echo peer</h1>
      <form id="start">
        <input id="email" type="email" placeholder="Email" required />
        <input id="password" type="password" placeholder="Password" required />
        <input id="domain" placeholder="Accessible Domain UUID" required />
        <button id="start-button" type="submit">Start peer</button>
      </form>

      <pre id="local">Not connected</pre>

      <form id="send">
        <input id="remote-peer" placeholder="Remote Peer ID" required />
        <input id="remote-route" placeholder="Remote WSS route" required />
        <input id="message" placeholder="Message" required />
        <button id="send-button" type="submit" disabled>Send echo</button>
      </form>

      <button id="stop-button" type="button" disabled>Stop peer</button>
      <pre id="log" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/minimal.ts"></script>
  </body>
</html>
