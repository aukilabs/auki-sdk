<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Auki portable echo browser peer</title>
  </head>
  <body>
    <main id="status">loading portable echo</main>
    <script type="module">
      import init, { AukiEcho, AukiUserSession } from "/pkg-web/auki_portable_echo_web.js";

      const initialized = init();
      let peer;
      let echo;
      let terminal;

      globalThis.echoHarness = Object.freeze({
        async start({ email, password, domainId }) {
          await initialized;
          if (peer) {
            throw new Error("browser echo peer is already running");
          }
          const session = await AukiUserSession.loginDev(email, password);
          try {
            const domains = await session.accessibleDomains();
            let selected = false;
            for (const domain of domains) {
              try {
                selected ||= domain.id === domainId;
              } finally {
                domain.free();
              }
            }
            if (!selected) {
              throw new Error("the authenticated User cannot access the selected Domain");
            }
            peer = await session.startPeer(domainId);
            echo = new AukiEcho(peer);
            terminal = peer.waitStopped().then(
              () => ({ error: undefined }),
              (error) => ({ error }),
            );
          } finally {
            session.free();
          }
          document.querySelector("#status").textContent = "ready";
          return {
            peerId: peer.peerId,
            domainId: peer.domainId,
            protocol: echo.protocol,
            wssRoute: peer.wssRoute,
            tcpRoute: peer.tcpRoute,
          };
        },

        async serveOnce() {
          if (!peer || !echo) {
            throw new Error("browser echo peer is not running");
          }
          const receipt = await echo.nextServed();
          try {
            return {
              remotePeerId: receipt.remotePeerId,
              payload: Array.from(receipt.payload),
            };
          } finally {
            receipt.free();
          }
        },

        async sendEcho({ domainId, peerId, protocol, wssRoute, payload }) {
          if (!peer || !echo) {
            throw new Error("browser echo peer is not running");
          }
          if (domainId !== peer.domainId || protocol !== echo.protocol) {
            throw new Error("remote peer card is incompatible");
          }
          const receipt = await echo.sendExact(
            peerId,
            wssRoute,
            Uint8Array.from(payload),
          );
          try {
            return {
              remotePeerId: receipt.remotePeerId,
              payload: Array.from(receipt.payload),
            };
          } finally {
            receipt.free();
          }
        },

        async shutdown() {
          const running = peer;
          const mounted = echo;
          const stopped = terminal;
          peer = undefined;
          echo = undefined;
          terminal = undefined;
          if (!running) {
            return;
          }
          let closeError;
          try {
            await mounted?.close();
            await mounted?.close();
          } catch (error) {
            closeError = error;
          }
          const shutdown = running.shutdown();
          let fenced = false;
          try {
            new AukiEcho(running);
          } catch {
            fenced = true;
          }
          try {
            await shutdown;
            if (!fenced) {
              throw new Error("AukiPeer.shutdown() did not synchronously fence new protocols");
            }
            const terminalResult = await stopped;
            if (terminalResult?.error) {
              throw terminalResult.error;
            }
            if (closeError) {
              throw closeError;
            }
          } finally {
            mounted?.free();
            running.free();
            document.querySelector("#status").textContent = "stopped";
          }
        },
      });
    </script>
  </body>
</html>
