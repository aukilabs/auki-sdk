<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Auki portable echo browser peer</title>
  </head>
  <body>
    <main id="status">loading portable echo</main>
    <script type="module">
      import init, { BrowserUserSession } from "/pkg-web/auki_portable_echo_web.js";

      const initialized = init();
      let server;

      globalThis.echoHarness = Object.freeze({
        async start({ email, password, domainId }) {
          await initialized;
          if (server) {
            throw new Error("browser echo server is already running");
          }
          const session = await BrowserUserSession.loginDev(email, password);
          try {
            const domains = await session.accessibleDomains();
            let selected = false;
            for (const domain of domains) {
              try {
                selected ||= domain.id === domainId;
              } finally {
                domain.free();
              }
            }
            if (!selected) {
              throw new Error("the authenticated User cannot access the selected Domain");
            }
            server = await session.startPeer(domainId);
          } finally {
            session.free();
          }
          document.querySelector("#status").textContent = "ready";
          return {
            peerId: server.peerId,
            domainId: server.domainId,
            wssRoute: server.wssRoute,
            tcpRoute: server.tcpRoute,
          };
        },

        async serveOnce() {
          if (!server) {
            throw new Error("browser echo server is not running");
          }
          const receipt = await server.serveOnce();
          try {
            return {
              remotePeerId: receipt.remotePeerId,
              payload: Array.from(receipt.payload),
            };
          } finally {
            receipt.free();
          }
        },

        async shutdown() {
          const running = server;
          server = undefined;
          if (!running) {
            return;
          }
          try {
            await running.shutdown();
          } finally {
            running.free();
            document.querySelector("#status").textContent = "stopped";
          }
        },
      });
    </script>
  </body>
</html>
