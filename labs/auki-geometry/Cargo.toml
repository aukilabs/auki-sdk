[package]
name = "auki-geometry"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Spatial math, mesh ingest (OBJ parse / triangulation), and frame-convention helpers."

[features]
default = []
pnp = ["dep:pnp-core"]

[dependencies]
auki-datatypes = { path = "../auki-datatypes" }
auki-registry = { path = "../auki-registry" }
pnp-core = { git = "https://github.com/aukilabs/pnp-lab.git", rev = "c56b1d4d5518eac997f020168a4e508bb27d599a", optional = true }
