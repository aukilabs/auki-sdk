[package]
name = "auki-qr-localizer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Experimental calibrated QR localization against scenegraph anchors"

[features]
default = []
qr-detector = ["dep:auki-qr-detector"]

[dependencies]
auki-components = { path = "../auki-components" }
auki-scenegraph = { path = "../auki-scenegraph" }
auki-qr-detector = { path = "../auki-qr-detector", optional = true }
auki-geometry = { path = "../auki-geometry", features = ["pnp"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"
