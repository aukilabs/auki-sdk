[package]
name = "auki-time"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Auki SDK time primitives: session clocks, affine time transforms, and TimeTransform Log sampling."

[features]
default = []
components = ["dep:auki-components", "dep:serde", "dep:serde_json", "dep:thiserror"]

[dependencies]
auki-components = { path = "../auki-components", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
auki-registry = { path = "../auki-registry" }
auki-logs = { path = "../auki-logs" }
# `TimeTransformEntry` lives in `auki-datatypes` since Step 6 of the
# migration (2026-05-08, prost-encoded). Re-exported from this crate
# for short call sites; encoding handled via the `LogPayload` macro
# impl in `auki-datatypes`.
auki-datatypes = { path = "../auki-datatypes" }
# `TimeTransformSource` is manifest metadata since Step 6 — re-exported
# from `auki-manifests` for short call sites.
auki-manifests = { path = "../auki-manifests" }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
