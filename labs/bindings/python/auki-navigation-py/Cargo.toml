[package]
name = "auki-navigation-py"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for auki-navigation — Recast bake, pathfinding, restrict."

[lib]
name = "auki_navigation"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
auki-navigation-rs = { package = "auki-navigation", path = "../../../auki-navigation" }
auki-geometry = { path = "../../../auki-geometry" }
pyo3 = { version = "0.22", features = ["abi3-py38"] }

[dev-dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38", "auto-initialize"] }
