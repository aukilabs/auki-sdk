[package]
name = "auki-collaborative-mapping"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
auki-components = { path = "../../auki-components" }
auki-scenegraph = { path = "../../auki-scenegraph" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
auki-component-protocol = { path = "../../auki-component-protocol" }
auki-sdk = { path = "../../../core/auki-sdk" }
auki-p2p = { path = "../../../core/auki-p2p" }
chrono.workspace = true
jsonwebtoken = "10.4"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
