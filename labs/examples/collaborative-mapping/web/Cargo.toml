[package]
name = "auki-collaborative-mapping-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
auki-collaborative-mapping = { path = ".." }

[target.'cfg(target_arch = "wasm32")'.dependencies]
auki-sdk = { path = "../../../../core/auki-sdk" }
auki-sdk-web = { path = "../../../../core/bindings/web/auki-sdk-web" }
auki-components = { path = "../../../auki-components" }
auki-component-protocol = { path = "../../../auki-component-protocol" }
auki-scenegraph = { path = "../../../auki-scenegraph" }
futures.workspace = true
futures-timer.workspace = true
js-sys.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true, features = ["js"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
