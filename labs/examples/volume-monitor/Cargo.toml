[package]
name = "auki-component-volume-monitor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
microphone = ["dep:cpal"]

[dependencies]
anyhow.workspace = true
auki-components = { path = "../../auki-components" }
auki-component-protocol = { path = "../../auki-component-protocol" }
auki-sdk = { path = "../../../core/auki-sdk" }
auki-p2p = { path = "../../../core/auki-p2p" }
chrono.workspace = true
cpal = { version = "0.15.3", optional = true }
jsonwebtoken = "10.4"
p256 = { version = "0.13.2", features = ["pem"] }
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
